replicaCount: 2

image:
  repository: REPLACE_WITH_ECR_IMAGE_URI
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  path: /demo

config:
  APP_ENV: "production"
  APP_NAME: "demo-microservice"

secret:
  API_KEY: "assessment-demo-key"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
